[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openbox-barrier-demo"
version = "0.1.0"
description = "OpenBox-governed LangGraph agents performing cross-client intelligence research"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0,<1.0",
    "langchain-core>=1.3.3",
    "langchain-openai>=0.3.0",
    "langgraph>=0.2.0",
    "openbox-langgraph-sdk-python>=1.1.0",
    "openbox-sdk-python>=1.4.0",
    "python-dotenv>=1.0.1",
    "rich>=13.0.0",
    "uvicorn>=0.30.0,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
]

[project.scripts]
barrier-demo = "openbox_langgraph_client_intelligence.cli:run"
barrier-api = "openbox_langgraph_client_intelligence.web_api:run"
barrier-worker = "openbox_langgraph_client_intelligence.worker:run"
barrier-web = "openbox_langgraph_client_intelligence.web_launcher:run"

[tool.hatch.build.targets.wheel]
packages = ["src/openbox_langgraph_client_intelligence"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "PIE", "RUF"]
